name: Folio
options:
  bundleIdPrefix: com.mhxue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  EPUBKit:
    path: Packages/EPUBKit

targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Sources/Folio/App
      - path: Sources/Folio/Features
      - path: Sources/Folio/Services
      - path: Sources/Folio/Models
      - path: Sources/Folio/Theme
      - path: Sources/Folio/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Folio/Resources/pride_and_prejudice.epub
        buildPhase: resources
    dependencies:
      - package: EPUBKit
        product: EPUBKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhxue.folio
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Sources/Folio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete

  FolioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FolioTests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhxue.folioTests
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Folio:
    build:
      targets:
        Folio: all
        FolioTests: [test]
    test:
      testPlans:
        - path: Folio.xctestplan
          defaultPlan: true
