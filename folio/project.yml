name: Folio
options:
  bundleIdPrefix: com.mhxue
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  ZipFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - path: Sources/Folio
    resources:
      - Sources/Folio/Resources
    dependencies:
      - package: ZipFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhxue.folio
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: Sources/Folio/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
